name: Publish documentation

on:
  workflow_call:
    inputs:
      tool_slug:
        description: Site subpath for the tool.
        required: true
        type: string
      public_repo:
        description: owner/name of the public tool repository.
        required: true
        type: string
      site_repo:
        description: owner/name of the documentation site repository.
        required: true
        type: string
    secrets:
      SITE_PAGES_TOKEN:
        description: Token allowed to publish to the site repository.
        required: true
      PACKAGES_READ_TOKEN:
        description: >-
          Token with read:packages for the @syntax-syllogism scope. The
          per-repository GITHUB_TOKEN cannot read packages published from
          another repository, so the docs theme install needs an org-wide
          token rather than the job's own credentials.
        required: true

permissions:
  contents: read
  packages: read

concurrency:
  group: docs-publish-${{ inputs.site_repo }}

jobs:
  docs:
    if: github.repository == inputs.public_repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Astro loads `docs-site/astro.config.mjs` through Vite, and Vite reads
      # the repo-ROOT `tsconfig.json` while doing so — a nearer
      # `docs-site/tsconfig.json` does not shadow it. When the root tsconfig
      # `extends` a package (the oclif plugins extend
      # `@salesforce/dev-config/tsconfig-strict-esm`), that package must be
      # installed or the config load fails with "Tsconfig not found", before
      # any option inside the config can take effect.
      #
      # Detected rather than passed as an input so the caller contract is
      # unchanged. Repos with no root lockfile — a docs-only site — skip the
      # install entirely.
      - id: root
        name: Detect root package manager
        run: |
          if [ -f yarn.lock ]; then
            echo 'manager=yarn' >> "$GITHUB_OUTPUT"
            echo 'lockfile=yarn.lock' >> "$GITHUB_OUTPUT"
          elif [ -f package-lock.json ]; then
            echo 'manager=npm' >> "$GITHUB_OUTPUT"
            echo 'lockfile=package-lock.json' >> "$GITHUB_OUTPUT"
          else
            echo 'manager=' >> "$GITHUB_OUTPUT"
            echo 'lockfile=' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@syntax-syllogism'
          # Empty `cache` disables caching, for repos with no root lockfile.
          cache: ${{ steps.root.outputs.manager }}
          cache-dependency-path: ${{ steps.root.outputs.lockfile }}

      - name: Install root dependencies
        if: steps.root.outputs.manager != ''
        run: ${{ steps.root.outputs.manager == 'yarn' && 'yarn install --frozen-lockfile' || 'npm ci' }}

      - run: npm ci
        working-directory: docs-site
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

      - run: npm run build
        working-directory: docs-site

      - uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.SITE_PAGES_TOKEN }}
          external_repository: ${{ inputs.site_repo }}
          publish_branch: master
          publish_dir: docs-site/dist
          destination_dir: ${{ inputs.tool_slug }}/docs
          keep_files: true
